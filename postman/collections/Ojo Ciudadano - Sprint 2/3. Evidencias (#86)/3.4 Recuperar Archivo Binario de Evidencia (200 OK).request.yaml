$kind: http-request
url: "{{baseUrl}}/evidencias/{{evidenciaId}}/archivo"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{ciudadanoToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Cabeceras binarias incluyen Content-Type de imagen permitido', function () {
          const contentType = pm.response.headers.get('Content-Type');
          pm.expect(contentType).to.match(/^image\/(jpeg|png|webp)/);
      });
    language: text/javascript
order: 4000

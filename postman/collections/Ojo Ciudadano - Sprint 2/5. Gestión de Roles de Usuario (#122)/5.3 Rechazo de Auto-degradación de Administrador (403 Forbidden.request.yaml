$kind: http-request
name: 5.3 Rechazo de Auto-degradación de Administrador (403 Forbidden)
url: "{{baseUrl}}/usuarios/{{adminId}}/rol"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "rol": "CIUDADANO"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
      const jsonData = pm.response.json();
      pm.test('Impide que el administrador se quite su propio rol ADMIN', function () {
          pm.expect(jsonData).to.have.property('statusCode', 403);
          pm.expect(jsonData).to.have.property('error', 'Forbidden');
          pm.expect(jsonData).to.have.property('message').that.includes('administrador');
      });
    language: text/javascript
order: 3000

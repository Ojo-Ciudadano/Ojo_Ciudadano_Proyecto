$kind: http-request
name: 6.4 Rechazo 403 al Cambiar Rol de Usuario como Ciudadano (403 Forbidden)
url: "{{baseUrl}}/usuarios/{{usuarioObjetivoId}}/rol"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "rol": "ADMIN"
    }
auth:
  type: bearer
  credentials:
    token: "{{ciudadanoToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
      const jsonData = pm.response.json();
      pm.test('Respuesta contiene ErrorResponseFormat para operación exclusiva de ADMIN', function () {
          pm.expect(jsonData).to.have.property('statusCode', 403);
          pm.expect(jsonData).to.have.property('error', 'Forbidden');
          pm.expect(jsonData).to.have.property('message');
      });
    language: text/javascript
order: 4000

name: Actualizar Estado del Project por Dependencias

on:
  issues:
    types: [closed, edited, opened, reopened]
  workflow_dispatch:

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar dependencias y mover a Ready
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.payload.repository.owner.login;
            const repo = context.payload.repository.name;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const issue of issues) {
              const body = issue.body || '';
              const dependsMatch = body.match(/Depende de:([\s\S]*?)(?=(#\s*Objetivo|#\s*Alcance|#|$))/i);
              
              if (!dependsMatch) continue;

              const depIds = [...dependsMatch[1].matchAll(/#(\d+)/g)].map(m => parseInt(m[1]));
              if (depIds.length === 0) continue;

              let allDone = true;
              for (const id of depIds) {
                try {
                  const { data: depIssue } = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: id
                  });
                  if (depIssue.state !== 'closed') {
                    allDone = false;
                    break;
                  }
                } catch (e) {
                  allDone = false;
                  break;
                }
              }

              if (allDone) {
                const labels = issue.labels.map(l => l.name.toLowerCase());
                if (labels.includes('backlog')) {
                  try {
                    await github.rest.issues.removeLabel({
                      owner,
                      repo,
                      issue_number: issue.number,
                      name: 'Backlog'
                    });
                  } catch (e) {}

                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: issue.number,
                    labels: ['Ready']
                  });
                }
              }
            }

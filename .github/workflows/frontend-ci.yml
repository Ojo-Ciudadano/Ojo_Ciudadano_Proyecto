name: Frontend CI CD

on:
  pull_request:
    branches:
      - integration
    paths:
      - 'web/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches:
      - integration
    paths:
      - 'web/frontend/**'
      - '.github/workflows/frontend-ci.yml'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  REPO: ojo-ciudadano/ojo_ciudadano_proyecto
  IMAGE: ghcr.io/ojo-ciudadano/ojo_ciudadano_proyecto/web
  NAMESPACE: student-daalvarez
  VITE_API_URL: https://ojociudadano.dev.censei.cl

jobs:
  frontend-ci:
    name: Frontend - lint, tests y build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar lint
        run: npm run lint

      - name: Ejecutar pruebas
        run: npm test

      - name: Compilar frontend
        run: npm run build

      - name: Resumen de la ejecución
        if: always()
        run: |
          {
            echo "### Frontend CI (#349)"
            echo "- Estado general: ${{ job.status }}"
            echo "- Verificaciones: lint, pruebas y compilación"
            echo "- Ejecución: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar resultado en el Pull Request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHECK_STATUS: ${{ job.status }}
        with:
          script: |
            const icono = process.env.CHECK_STATUS === 'success' ? '✅' : '❌'
            const body = [
              `${icono} **frontend-ci** (#349)`,
              '',
              '- Lint: `npm run lint`',
              '- Pruebas: `npm test`',
              '- Compilación: `npm run build`',
              `- Estado general: \`${process.env.CHECK_STATUS}\``,
              `- Ejecución: ${process.env.RUN_URL}`,
            ].join('\n')

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })

  deploy:
    name: Desplegar web en Kubernetes UCT
    needs: [frontend-ci]
    if: github.event_name == 'push' && needs['frontend-ci'].result == 'success'
    runs-on: ubuntu-latest

    environment:
      name: student-daalvarez
      url: https://ojociudadano.dev.censei.cl

    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web/frontend
          file: ./web/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Configurar kubectl
        run: |
          printf '%s' "${{ secrets.K8S_CA }}" | base64 -d > "$RUNNER_TEMP/ca.crt"
          kubectl config set-cluster uct \
            --server=https://k8s-estudiantes.dev.censei.cl \
            --certificate-authority="$RUNNER_TEMP/ca.crt"
          kubectl config set-credentials ci \
            --token="${{ secrets.K8S_TOKEN }}"
          kubectl config set-context ci \
            --cluster=uct \
            --user=ci \
            --namespace="${{ env.NAMESPACE }}"
          kubectl config use-context ci

      - name: Desplegar en Kubernetes
        run: |
          set -euo pipefail

          IMAGEN="${{ env.IMAGE }}:${{ github.sha }}"

          kubectl set image deployment/web-frontend \
            web-frontend="$IMAGEN" \
            --namespace="${{ env.NAMESPACE }}"

          kubectl rollout status deployment/web-frontend \
            --namespace="${{ env.NAMESPACE }}" \
            --timeout=180s

      - name: Registrar despliegue en el Pull Request asociado
        if: always()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          script: |
            const icono = process.env.DEPLOY_STATUS === 'success' ? '✅' : '❌'
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              })

            const body = [
              `${icono} **Despliegue frontend en Kubernetes UCT** (#349)`,
              '',
              `- Estado: \`${process.env.DEPLOY_STATUS}\``,
              `- Namespace: \`student-daalvarez\``,
              `- Imagen: \`${process.env.IMAGE_TAG}\``,
              `- Ejecución: ${process.env.RUN_URL}`,
            ].join('\n')

            for (const pr of prs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              })
            }
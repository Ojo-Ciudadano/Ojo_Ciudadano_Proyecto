name: Backend CI CD

on:
  push:
    branches:
      - integration
    paths:
      - 'web/backend/**'

env:
  REGISTRY: ghcr.io
  REPO: ojo-ciudadano/ojo_ciudadano_proyecto

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api-gateway, auth-usuarios, incidentes, notificaciones]
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.app }}:latest
          build-args: |
            APP_NAME=${{ matrix.app }}

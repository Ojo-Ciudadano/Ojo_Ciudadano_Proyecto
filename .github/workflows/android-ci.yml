name: Android CI

on:
  push:
    branches:
      - main
      - "mobile/sprint1-integration"
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"

  pull_request:
    branches:
      - main
      - "mobile/sprint1-integration"
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"

jobs:
  build:
    name: Android - Test, Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Ejecutar tests unitarios
        run: ./gradlew testDebugUnitTest

      - name: Ejecutar Android Lint
        run: ./gradlew lintDebug

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug

      - name: Guardar reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: mobile/app/build/reports/

      - name: Guardar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ojo-ciudadano-debug
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
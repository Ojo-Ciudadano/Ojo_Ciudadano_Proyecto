server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de nginx en las respuestas.
    server_tokens off;

    # Limite alineado con el Ingress (12m) y el API Gateway para carga de evidencias/avatares.
    client_max_body_size 12m;

    # Compresion Gzip para HTML (habilitado por defecto) y recursos de texto elegibles.
    gzip on;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        application/manifest+json
        image/svg+xml;

    # Cabeceras HTTP de seguridad base para las respuestas servidas por Nginx.
    # Compatible con SPA React/Vite, mapas Leaflet/OpenStreetMap, geolocalizacion
    # en el mismo origen (reportes) y previsualizacion de evidencias via blob:.
    # Nota: no se declara Strict-Transport-Security aqui porque el Ingress UCT usa
    # certificado autofirmado y el entorno local Docker Compose sirve por HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Sonda de salud usada por readiness/liveness del Deployment y HEALTHCHECK Docker.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Activos generados por Vite con hash en el nombre: cache de larga duracion e inmutable.
    # En Nginx, usar add_header dentro de un location reemplaza los del bloque server,
    # por lo que se redeclaran explicitamente las cabeceras de seguridad.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    # index.html (y cualquier ruta interna de la SPA resuelta hacia /index.html)
    # no se almacena en cache para que un despliegue nuevo se sirva de inmediato.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    # Intercepta las llamadas a la API y las envía al Gateway interno.
    # IMPORTANTE: el proxy_pass NO lleva URI (sin "/" final). Si se agrega una
    # URI, nginx reemplaza el prefijo /api/ y el Gateway recibe /v1/... en vez
    # de /api/v1/..., devolviendo 404 (el Gateway monta todo bajo api/v1).
    location /api/ {
        proxy_pass http://api-gateway-svc:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Cabeceras base sin CSP de SPA para mantener compatibilidad con /api/docs (Swagger UI).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    }

    # Fallback SPA: las rutas de React Router redirigen internamente a /index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

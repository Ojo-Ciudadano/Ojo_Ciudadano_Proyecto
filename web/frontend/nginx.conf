server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de nginx en las respuestas.
    server_tokens off;

    # Compresion de activos de texto.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        text/xml
        image/svg+xml;

    # Sonda de salud usada por readiness/liveness del Deployment.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Activos generados por Vite con hash en el nombre: cache de largo plazo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea para que un despliegue nuevo se sirva de inmediato.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Fallback SPA: las rutas de React Router (/login, /incidentes, etc.) se
    # resuelven en el cliente. Si el archivo no existe se devuelve index.html
    # para evitar 404 al acceder directamente o recargar una ruta.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

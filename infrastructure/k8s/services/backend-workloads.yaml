apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-usuarios
spec:
  selector:
    matchLabels:
      app: auth-usuarios
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: auth-usuarios
    spec:
      containers:
        - name: auth-usuarios
          image: ghcr.io/ojo-ciudadano/ojo_ciudadano_proyecto/auth-usuarios:latest
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: postgres-auth
            - name: DATABASE_URL
              value: "postgresql://auth_user:$(DB_PASSWORD)@$(DB_HOST_AUTH):$(DB_PORT_AUTH)/$(DB_NAME_AUTH)?schema=public"
            - name: DATABASE_URL_AUTH
              value: "postgresql://auth_user:$(DB_PASSWORD)@$(DB_HOST_AUTH):$(DB_PORT_AUTH)/$(DB_NAME_AUTH)?schema=public"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
          ports:
            - containerPort: 3001
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
spec:
  selector:
    app: auth-usuarios
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incidentes
spec:
  selector:
    matchLabels:
      app: incidentes
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: incidentes
    spec:
      containers:
        - name: incidentes
          image: ghcr.io/ojo-ciudadano/ojo_ciudadano_proyecto/incidentes:latest
          envFrom:
            - configMapRef:
                name: backend-config
            - configMapRef:
                name: supabase-config
            - secretRef:
                name: supabase-credentials
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: postgres-incidentes
            - name: DATABASE_URL
              value: "postgresql://incidentes_user:$(DB_PASSWORD)@$(DB_HOST_INCIDENTES):$(DB_PORT_INCIDENTES)/$(DB_NAME_INCIDENTES)?schema=public"
            - name: DATABASE_URL_INCIDENTES

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
          ports:
            - containerPort: 3002
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 150m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: incidentes-svc
spec:
  selector:
    app: incidentes
  ports:
    - protocol: TCP
      port: 3002
      targetPort: 3002
  type: ClusterIP

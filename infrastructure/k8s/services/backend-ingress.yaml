# Ingress del API Gateway para clientes que lo consumen por su host dedicado
# (por ejemplo la app Android: BuildConfig.API_BASE_URL apunta aqui).
#
# NOTA: este objeto se llamaba "api-gateway-ingress", igual que el Ingress del
# host de la Web (api-gateway-ingress.yaml). Al compartir kind+name+namespace,
# el orden de aplicacion decidia cual sobrevivia. Se renombra para que ambos
# Ingress coexistan sin colision. El host, el Service y el puerto NO cambian:
# el flujo Android no se ve afectado.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ojociudadano-ingress
  namespace: student-daalvarez
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # 10 MB de evidencia + overhead multipart < 12 MB; el gateway y Multer ya
    # acotan el cuerpo a 12 MB, asi que subir este valor solo moveria el 413.
    nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    # Transferencia de imagenes: la app Android espera hasta 120 s de escritura
    # y 60 s de lectura; el buffering de request se desactiva para reenviar el
    # multipart en streaming en lugar de escribir 10 MB en disco antes de proxy.
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    nginx.ingress.kubernetes.io/proxy-busy-buffers-size: "32k"
    external-dns.alpha.kubernetes.io/target: "proxy.inf.uct.cl"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api-ojociudadano.dev.censei.cl
    secretName: uct-ingress-tls
  rules:
  - host: api-ojociudadano.dev.censei.cl
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway-svc
            port:
              number: 3000
